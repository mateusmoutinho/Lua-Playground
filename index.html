<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Lua Playground</title>
    <!-- CodeMirror CSS and JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/midnight.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/lua/lua.min.js"></script>
    
    <!-- Fengari Lua VM for the web -->
    <script src="https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.js"></script>
    
    <style>
        :root {
            --neon-blue: #0ef;
            --neon-pink: #f0e;
            --neon-purple: #c0f;
            --dark-bg: #0a0a12;
            --darker-bg: #05050a;
            --glow-effect: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
            --panel-bg: rgba(15, 15, 25, 0.7);
        }
        
        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'Courier New', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(15, 238, 255, 0.1) 0%, transparent 50%),
                linear-gradient(to right, rgba(240, 0, 238, 0.05), rgba(0, 238, 255, 0.05));
        }
        
        header {
            background-color: var(--darker-bg);
            padding: 15px;
            border-bottom: 1px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 238, 255, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 {
            margin: 0;
            color: var(--neon-blue);
            text-shadow: 0 0 5px var(--neon-blue);
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .glitch-effect {
            position: relative;
            animation: glitch 2s infinite;
        }
        
        @keyframes glitch {
            0% { text-shadow: 0 0 5px var(--neon-blue); }
            2% { text-shadow: 2px 0 5px var(--neon-pink), -2px 0 5px var(--neon-blue); }
            4% { text-shadow: 0 0 5px var(--neon-blue); }
            50% { text-shadow: 0 0 5px var(--neon-blue); }
            52% { text-shadow: 1px 0 3px var(--neon-purple), -1px 0 3px var(--neon-blue); }
            54% { text-shadow: 0 0 5px var(--neon-blue); }
            100% { text-shadow: 0 0 5px var(--neon-blue); }
        }
        
        .run-button {
            background-color: var(--darker-bg);
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 8px 20px;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px var(--neon-blue);
            letter-spacing: 1px;
            outline: none;
        }
        
        .run-button:hover {
            background-color: rgba(0, 238, 255, 0.2);
            box-shadow: var(--glow-effect);
        }
        
        .run-button:active {
            transform: scale(0.95);
        }
        
        main {
            display: flex;
            flex: 1;
            height: calc(100vh - 70px);
            overflow: hidden;
        }
        
        .editor-container, .output-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            padding: 15px;
            box-sizing: border-box;
            margin: 10px;
            background-color: var(--panel-bg);
            border: 1px solid var(--neon-blue);
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 238, 255, 0.3);
        }
        
        .container-header {
            color: var(--neon-blue);
            margin: 0 0 10px 0;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--neon-blue);
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .container-header::before, .container-header::after {
            content: '>';
            font-weight: bold;
        }
        
        .CodeMirror {
            height: calc(100% - 35px);
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            background-color: var(--darker-bg) !important;
        }
        
        .cm-s-midnight.CodeMirror {
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        .output-view {
            height: calc(100% - 35px);
            overflow-y: auto;
            background-color: var(--darker-bg);
            padding: 10px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
            color: #0f0;
            white-space: pre-wrap;
            word-break: break-all;
            position: relative;
        }
        
        .output-view::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--neon-blue), transparent);
            opacity: 0.5;
        }
        
        .scanline {
            width: 100%;
            height: 1px;
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            z-index: 42;
            animation: scanline 5s linear infinite;
            opacity: 0.3;
            pointer-events: none;
        }
        
        @keyframes scanline {
            0% { top: 0; }
            100% { top: 100%; }
        }
        
        @media (max-width: 768px) {
            main {
                flex-direction: column;
            }
            
            .editor-container, .output-container {
                flex: none;
                height: 50%;
            }
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <header>
        <h1 class="glitch-effect">Cyberpunk Lua Playground</h1>
        <button id="runButton" class="run-button">Execute</button>
    </header>
    
    <main>
        <div class="editor-container">
            <div class="container-header">CODE.LUA</div>
            <textarea id="codeEditor">-- Your Lua code here
print("Hello, cyberpunk world!")
print("Running Lua " .. _VERSION)

local function factorial(n)
    if n <= 1 then
        return 1
    else
        return n * factorial(n-1)
    end
end

print("Factorial of 5 is: " .. factorial(5))</textarea>
        </div>
        
        <div class="output-container">
            <div class="container-header">TERMINAL_OUTPUT</div>
            <div id="outputView" class="output-view">// Output will appear here\n> Awaiting execution...</div>
        </div>
    </main>
    
    <script>
        // Initialize CodeMirror
        const codeEditor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
            mode: 'lua',
            theme: 'midnight',
            lineNumbers: true,
            indentUnit: 4,
            tabSize: 4,
            indentWithTabs: false,
            lineWrapping: true,
            scrollbarStyle: 'overlay',
            autofocus: true,
            autoCloseBrackets: true,
            highlightSelectionMatches: true
        });
        
        // Initialize output view
        const outputView = document.getElementById('outputView');
        const runButton = document.getElementById('runButton');
        
        // Create a custom print function for Lua
        const originalPrint = window.fengari_web.interop.luaconf.lua.print;
        let outputText = '';
        
        window.fengari_web.interop.luaconf.lua.print = function(...args) {
            for (let i = 0; i < args.length; i++) {
                let arg = args[i];
                if (typeof arg === 'object' && arg !== null) {
                    // Try to convert object to string if possible
                    arg = window.fengari_web.interop.tojs(arg);
                }
                outputText += arg + (i < args.length - 1 ? '\t' : '');
            }
            outputText += '\n';
        };
        
        // Run Lua code
        runButton.addEventListener('click', () => {
            const code = codeEditor.getValue();
            outputText = ''; // Clear previous output
            outputView.innerHTML = '> Executing code...\n';
            
            // Add a slight delay for visual effect
            setTimeout(() => {
                try {
                    // Execute the Lua code
                    window.fengari_web.load(code)();
                    
                    // Display the output
                    outputView.innerHTML = '> Execution complete\n\n' + outputText;
                    
                    // Cyberpunk terminal effect - add random characters at the end
                    const randomChars = Array(20).fill(0).map(() => 
                        String.fromCharCode(Math.floor(Math.random() * 26) + 97)
                    ).join('');
                    
                    outputView.innerHTML += '\n\n//' + randomChars;
                } catch (err) {
                    // Display error
                    outputView.innerHTML = '> Error detected\n\n' + err.message;
                }
                
                // Scroll to bottom of output
                outputView.scrollTop = outputView.scrollHeight;
            }, 300);
        });
        
        // Add some cyberpunk effects
        document.addEventListener('DOMContentLoaded', () => {
            // Random flicker effect for neon elements
            setInterval(() => {
                if (Math.random() > 0.97) {
                    document.querySelector('h1').style.opacity = Math.random() * 0.5 + 0.5;
                    setTimeout(() => {
                        document.querySelector('h1').style.opacity = 1;
                    }, 100);
                }
            }, 200);
        });
    </script>
</body>
</html>
