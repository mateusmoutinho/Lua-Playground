<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua Playground - Cyberpunk Edition</title>
    <!-- CodeMirror CSS - Code Editor -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/cyberpunk.min.css">
    <!-- Custom CSS -->
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-purple: #9900ff;
            --dark-bg: #121212;
            --darker-bg: #0a0a0a;
            --panel-bg: rgba(20, 20, 30, 0.8);
            --glow-strength: 2px;
        }

        @font-face {
            font-family: 'Cyber';
            src: url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark-bg);
            color: var(--neon-blue);
            font-family: 'Share Tech Mono', monospace;
            background-image: 
                linear-gradient(rgba(10, 10, 15, 0.9), rgba(10, 10, 15, 0.9)),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23000"/><path d="M0 50 L100 50 M50 0 L50 100" stroke="%23112" stroke-width="1"/></svg>');
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 var(--glow-strength) var(--neon-blue);
            letter-spacing: 3px;
            position: relative;
        }

        h1::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-pink));
            box-shadow: 0 0 var(--glow-strength) var(--neon-blue);
        }

        .grid {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
            height: calc(100vh - 180px);
        }

        .panel {
            background: var(--panel-bg);
            border-radius: 5px;
            padding: 15px;
            position: relative;
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            display: flex;
            flex-direction: column;
        }

        .panel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(to right, var(--neon-blue), transparent);
        }

        .panel-title {
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--neon-blue);
            text-shadow: 0 0 5px var(--neon-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-panel {
            overflow: hidden;
        }

        .output-panel {
            position: relative;
        }

        .output-content {
            flex-grow: 1;
            overflow: auto;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 3px;
            font-family: monospace;
            resize: none;
            border: none;
            color: #11ff11;
            height: calc(100% - 60px);
            white-space: pre-wrap;
        }

        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .cybr-btn {
            padding: 10px 20px;
            background: transparent;
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 0 5px var(--neon-blue);
        }

        .cybr-btn:hover {
            background: rgba(0, 243, 255, 0.1);
            box-shadow: 0 0 10px var(--neon-blue);
        }

        .cybr-btn:active {
            transform: scale(0.95);
        }

        .CodeMirror {
            height: calc(100% - 60px);
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px;
            border-radius: 3px;
        }

        /* Animation for terminal cursor */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background-color: var(--neon-blue);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Glitch effect for title */
        @keyframes glitch {
            0% {
                text-shadow: 0.05em 0 0 var(--neon-pink), -0.05em -0.025em 0 var(--neon-blue),
                            -0.025em 0.05em 0 var(--neon-purple);
            }
            14% {
                text-shadow: 0.05em 0 0 var(--neon-pink), -0.05em -0.025em 0 var(--neon-blue),
                            -0.025em 0.05em 0 var(--neon-purple);
            }
            15% {
                text-shadow: -0.05em -0.025em 0 var(--neon-pink), 0.025em 0.025em 0 var(--neon-blue),
                            -0.05em -0.05em 0 var(--neon-purple);
            }
            49% {
                text-shadow: -0.05em -0.025em 0 var(--neon-pink), 0.025em 0.025em 0 var(--neon-blue),
                            -0.05em -0.05em 0 var(--neon-purple);
            }
            50% {
                text-shadow: 0.025em 0.05em 0 var(--neon-pink), 0.05em 0 0 var(--neon-blue),
                            0 -0.05em 0 var(--neon-purple);
            }
            99% {
                text-shadow: 0.025em 0.05em 0 var(--neon-pink), 0.05em 0 0 var(--neon-blue),
                            0 -0.05em 0 var(--neon-purple);
            }
            100% {
                text-shadow: -0.025em 0 0 var(--neon-pink), -0.025em -0.025em 0 var(--neon-blue),
                            -0.025em -0.05em 0 var(--neon-purple);
            }
        }

        .glitch {
            animation: glitch 3s infinite;
        }

        /* Examples dropdown styling */
        select {
            background: var(--darker-bg);
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 8px 12px;
            border-radius: 3px;
            box-shadow: 0 0 5px var(--neon-blue);
            font-family: 'Share Tech Mono', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="glitch">LUA CYBERPUNK PLAYGROUND</h1>
        </header>

        <div class="grid">
            <!-- Code Editor Panel -->
            <div class="panel code-panel">
                <div class="control-bar">
                    <h2 class="panel-title">CODE.lua<span class="cursor"></span></h2>
                    <div>
                        <select id="examples" class="cybr-select">
                            <option value="">Select example...</option>
                            <option value="hello">Hello World</option>
                            <option value="factorial">Factorial</option>
                            <option value="fibonacci">Fibonacci</option>
                            <option value="table">Table Operations</option>
                            <option value="closure">Closures</option>
                        </select>
                        <button id="run-btn" class="cybr-btn">RUN</button>
                        <button id="clear-btn" class="cybr-btn">CLEAR</button>
                    </div>
                </div>
                <textarea id="code-editor">-- Welcome to LUA Cyberpunk Playground
-- Write your code here...

function main()
    print("Hello, Cyberpunk World!")
    print("The time is " .. os.date("%X"))
    
    -- Cyberpunk inspired calculation
    local year = 2077
    local current_year = os.date("%Y")
    print("Years until Cyberpunk: " .. (year - tonumber(current_year)))
    
    -- Display some Lua capabilities
    local message = "CODE IS POETRY"
    for i = 1, #message do
        print(string.sub(message, 1, i))
    end
end

main()</textarea>
            </div>

            <!-- Output Panel -->
            <div class="panel output-panel">
                <div class="control-bar">
                    <h2 class="panel-title">CONSOLE.output</h2>
                    <button id="copy-btn" class="cybr-btn">COPY</button>
                </div>
                <pre id="output" class="output-content">// Output will appear here after running your code...
// SYSTEM READY...</pre>
            </div>
        </div>
    </div>

    <!-- CodeMirror JS - Code Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/lua/lua.min.js"></script>

    <!-- Fengari Lua VM -->
    <script src="https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.js"></script>

    <!-- Custom JS -->
    <script>
        // Initialize CodeMirror editor with Lua mode
        const editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
            mode: 'lua',
            theme: 'cyberpunk',
            lineNumbers: true,
            autoCloseBrackets: true,
            matchBrackets: true,
            indentUnit: 4,
            smartIndent: true,
            tabSize: 4,
            indentWithTabs: false,
            lineWrapping: true,
            extraKeys: {
                "Tab": function(cm) {
                    cm.replaceSelection("    ", "end");
                }
            }
        });

        // Elements
        const outputElement = document.getElementById('output');
        const runButton = document.getElementById('run-btn');
        const clearButton = document.getElementById('clear-btn');
        const copyButton = document.getElementById('copy-btn');
        const examplesDropdown = document.getElementById('examples');

        // Redirect Lua print to our output element
        const originalPrint = fengari.lua.lua_print;
        fengari.lua.lua_print = function(...args) {
            const values = Array.from(args).slice(1); // Skip the first argument which is the Lua state
            const output = values.map(v => fengari.interop.tojs(v)).join('\t');
            outputElement.textContent += output + '\n';
            return 0;
        };

        // Run the Lua code in the editor
        function runLuaCode() {
            // Clear previous output
            outputElement.textContent = "// Running code...\n";
            outputElement.textContent += "// SYSTEM INITIALIZED...\n\n";

            setTimeout(() => {
                try {
                    const code = editor.getValue();
                    fengari.load(code)();
                    outputElement.textContent += "\n// EXECUTION COMPLETE";
                } catch (error) {
                    outputElement.textContent += "\n// ERROR: " + error.message;
                }
            }, 100);
        }

        // Clear editor and output
        function clearAll() {
            editor.setValue('');
            outputElement.textContent = "// Output cleared.\n// SYSTEM READY...";
        }

        // Copy output to clipboard
        function copyOutput() {
            const outputText = outputElement.textContent;
            navigator.clipboard.writeText(outputText)
                .then(() => {
                    // Show notification
                    const oldText = copyButton.textContent;
                    copyButton.textContent = "COPIED!";
                    setTimeout(() => {
                        copyButton.textContent = oldText;
                    }, 1500);
                })
                .catch(err => {
                    console.error('Failed to copy: ', err);
                });
        }

        // Load example code
        function loadExample(example) {
            let code = "";
            switch (example) {
                case "hello":
                    code = `-- Hello World Example

print("Hello, Cyberpunk World!")

-- Using string concatenation
local name = "V"
print("Welcome, " .. name .. "!")

-- Using string formatting
print(string.format("Current memory: %d bytes", collectgarbage("count") * 1024))`;
                    break;
                case "factorial":
                    code = `-- Factorial Example

function factorial(n)
    if n == 0 then
        return 1
    else
        return n * factorial(n - 1)
    end
end

print("Factorial Calculator")

for i = 0, 10 do
    print(i .. "! = " .. factorial(i))
end`;
                    break;
                case "fibonacci":
                    code = `-- Fibonacci Example

function fibonacci(n)
    if n <= 1 then
        return n
    else
        return fibonacci(n-1) + fibonacci(n-2)
    end
end

print("Fibonacci Sequence")

print("Using recursive function:")
for i = 0, 10 do
    print("fibonacci(" .. i .. ") = " .. fibonacci(i))
end

print("\nUsing iterative approach:")
local a, b = 0, 1
for i = 0, 10 do
    print("fibonacci(" .. i .. ") = " .. a)
    a, b = b, a + b
end`;
                    break;
                case "table":
                    code = `-- Table Operations Example

-- Creating a table
local cyberpunk_chars = {
    "V",
    "Johnny Silverhand",
    "Judy Alvarez",
    "Panam Palmer",
    "Jackie Welles"
}

print("Cyberpunk Characters:")
for i, char in ipairs(cyberpunk_chars) do
    print(i .. ". " .. char)
end

-- Table as dictionary
local char_info = {
    V = "Protagonist",
    Johnny = "Rockerboy",
    Judy = "Techie",
    Panam = "Nomad",
    Jackie = "Merc"
}

print("\nCharacter Classes:")
for name, class in pairs(char_info) do
    print(name .. " is a " .. class)
end

-- Table methods
print("\nTable Manipulation:")
table.insert(cyberpunk_chars, "Dexter DeShawn")
print("Added: " .. cyberpunk_chars[#cyberpunk_chars])

table.sort(cyberpunk_chars)
print("Sorted characters:")
for i, char in ipairs(cyberpunk_chars) do
    print(i .. ". " .. char)
end`;
                    break;
                case "closure":
                    code = `-- Closures Example

function counter(start)
    local count = start or 0
    
    -- This inner function forms a closure
    return function(increment)
        increment = increment or 1
        count = count + increment
        return count
    end
end

print("Closure Example - Counters")

local counter1 = counter(10)
local counter2 = counter(100)

print("Counter 1 starts at 10")
print("First call: " .. counter1())  -- 11
print("Second call: " .. counter1()) -- 12
print("Increment by 5: " .. counter1(5)) -- 17

print("\nCounter 2 starts at 100")
print("First call: " .. counter2())  -- 101
print("Second call: " .. counter2()) -- 102

-- Another closure example: a function factory
function makeMultiplier(factor)
    return function(x)
        return x * factor
    end
end

print("\nMultiplier functions:")
local double = makeMultiplier(2)
local triple = makeMultiplier(3)

print("Double 5: " .. double(5)) -- 10
print("Triple 5: " .. triple(5)) -- 15`;
                    break;
                default:
                    return;
            }
            editor.setValue(code);
        }

        // Event listeners
        runButton.addEventListener('click', runLuaCode);
        clearButton.addEventListener('click', clearAll);
        copyButton.addEventListener('click', copyOutput);
        examplesDropdown.addEventListener('change', function() {
            loadExample(this.value);
            this.value = ""; // Reset the dropdown
        });

        // Keyboard shortcut for running code (Ctrl+Enter)
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                runLuaCode();
            }
        });

        // Add a little cyberpunk effect to the output on page load
        window.addEventListener('load', function() {
            let message = "// SYSTEM BOOTING...\n";
            outputElement.textContent = "";
            
            let i = 0;
            const typeEffect = setInterval(function() {
                if (i < message.length) {
                    outputElement.textContent += message.charAt(i);
                    i++;
                } else {
                    clearInterval(typeEffect);
                    outputElement.textContent += "\n// INITIALIZATION COMPLETE...\n// READY FOR CODE EXECUTION...\n";
                }
            }, 30);
        });
    </script>
</body>
</html>
